<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>{{TITLE}} | by JDG Delivery</title><style>
:root{color-scheme:dark;--text:#eeeae2;--muted:#aaa8a3;--line:#ffffff20;--gold:#d6b77f}*{box-sizing:border-box}body{margin:0;background:#090a0c;color:var(--text);font:15px/1.6 Arial,Helvetica,sans-serif}a{color:inherit}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.wrap{max-width:1200px;margin:auto;padding:32px 5vw 45px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{font:34px Georgia,serif;text-decoration:none;letter-spacing:-2px}.eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}.intro{padding:38px 0 30px}h1{font:400 clamp(34px,5vw,54px)/1.1 Georgia,serif;letter-spacing:-1.5px;margin:13px 0 16px}h2{font:400 30px/1.2 Georgia,serif;margin:12px 0}p{margin:0;white-space:pre-line}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:24px;align-items:start}.glass{background:linear-gradient(135deg,#ffffff0c,#ffffff03),#101113;border:1px solid var(--line);border-radius:13px;box-shadow:inset 0 1px 0 #ffffff08,0 16px 42px #0005;padding:24px;min-width:0}nav{display:grid;gap:8px;margin-top:20px}.project-link{display:block;text-decoration:none;background:transparent;border:1px solid transparent;border-radius:8px;padding:13px 10px;text-align:left;color:var(--text)}.project-link[aria-current="true"]{background:#ffffff0b;border-color:var(--line);color:var(--gold)}.project-link small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.search{width:100%;background:#08090b;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:6px;margin-top:15px;font-size:14px}.file{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:15px;padding:22px 0;border-bottom:1px solid var(--line)}.number{font:23px Georgia,serif;color:var(--gold)}.file-title{font-size:15px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px}.download{font-size:12px;display:inline-flex;gap:12px;align-items:center;text-decoration:none;padding:12px 15px;border:1px solid #ffffff2b;border-radius:6px;background:#ffffff08;white-space:nowrap}.download:hover{background:#ffffff12;border-color:var(--gold)}.files-heading{margin-top:28px;padding-top:23px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:24px;margin-top:32px}.empty{padding:25px 0;color:var(--muted)}[hidden]{display:none!important}.project[hidden]{display:none}.preview{padding:10px 5vw;text-align:center;background:#30271b;color:#efd4a7;font-size:12px}.help{margin-top:22px;font-size:12px;color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}.wrap{padding:24px 20px}.glass{padding:20px}nav{grid-template-columns:repeat(2,minmax(0,1fr))}.file{grid-template-columns:25px minmax(0,1fr);gap:12px}.download{grid-column:2;justify-self:start}.foot{flex-direction:column}header .muted{font-size:11px}.search{font-size:16px}}
</style></head><body>{{PREVIEW}}<div class="wrap"><header><a class="brand" href="https://www.byjdg.com/">by JDG</a><span class="muted">Client delivery</span></header><div class="intro"><div class="eyebrow">Prepared for {{CLIENT}}</div><h1>Your project library.</h1><p class="muted">{{MESSAGE}}</p></div><div class="layout"><aside class="glass"><div class="eyebrow">Your projects</div><label class="muted" for="search">Find a project</label><input class="search" id="search" type="search" placeholder="Search projects…"><nav aria-label="Projects">{{NAV}}</nav><p id="no-matches" class="empty" hidden>No matching projects.</p></aside><main class="glass">{{PROJECTS}}</main></div><footer class="foot"><span>Made with care. Delivered to you. / by JDG</span><span>Save a local copy of your files.</span></footer></div><script>
(function(){const buttons=[...document.querySelectorAll('[data-project]')],panels=[...document.querySelectorAll('.project')];function select(id){buttons.forEach(b=>b.setAttribute('aria-current',String(b.dataset.project===id)));panels.forEach(p=>p.hidden=p.id!==id);}buttons.forEach(b=>b.addEventListener('click',()=>select(b.dataset.project)));document.getElementById('search').addEventListener('input',function(){const q=this.value.trim().toLowerCase();buttons.forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));document.getElementById('no-matches').hidden=buttons.some(b=>!b.hidden);});if(buttons[0])select(buttons[0].dataset.project);})();
</script></body></html>
